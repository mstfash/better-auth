name: AuthOwl artifacts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - authowl/stable-1.6
    paths:
      - ".github/workflows/authowl-artifacts.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/authowl/**"
      - "packages/better-auth/**"
      - "packages/core/**"
      - "packages/drizzle-adapter/**"
      - "packages/kysely-adapter/**"
      - "packages/memory-adapter/**"
      - "packages/mongo-adapter/**"
      - "packages/passkey/**"
      - "packages/prisma-adapter/**"
      - "packages/telemetry/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0
          path: better-auth
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          repository: mstfash/utils
          ref: authowl/stable-0.4
          fetch-depth: 0
          path: utils
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
      - run: corepack enable
      - name: Test deterministic archive writer
        working-directory: better-auth
        run: pnpm authowl:artifacts:test
      - name: Build AuthOwl artifacts twice
        working-directory: better-auth
        run: |
          pnpm authowl:artifacts --utils-dir ../utils --output artifacts/run-a
          pnpm authowl:artifacts --utils-dir ../utils --output artifacts/run-b
      - name: Verify byte-for-byte reproducibility
        working-directory: better-auth
        run: diff -ru artifacts/run-a artifacts/run-b
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authowl-better-auth-${{ github.sha }}
          path: better-auth/artifacts/run-a
          if-no-files-found: error
